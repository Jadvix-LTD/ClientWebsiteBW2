<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t d">
  <title id="t">Architectural general arrangement plan</title>
  <desc id="d">A residential floor plan with living, study, bathroom and bedroom, showing walls, door swings, windows, dimensions and a north arrow.</desc>
  <defs>
    <pattern id="tile" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0H10V10" fill="none" stroke="#E3EAF4" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="640" height="460" fill="#FFFFFF"/>
  <rect x="10" y="10" width="620" height="440" fill="none" stroke="#D5DFEC"/>

  <!-- floor finishes -->
  <rect x="308" y="214" width="102" height="134" fill="url(#tile)"/>

  <!-- walls -->
  <g fill="#0C2A5B">
    <path fill-rule="evenodd" d="M90 60H530V360H90Z M102 72V348H518V72Z"/>
    <rect x="300" y="72" width="8" height="276"/>
    <rect x="308" y="206" width="210" height="8"/>
    <rect x="410" y="214" width="8" height="134"/>
  </g>

  <!-- openings -->
  <g fill="#FFFFFF">
    <rect x="150" y="347" width="40" height="14"/>
    <rect x="299" y="140" width="10" height="34"/>
    <rect x="299" y="250" width="10" height="30"/>
    <rect x="452" y="205" width="34" height="10"/>
    <rect x="140" y="59" width="100" height="14"/>
    <rect x="360" y="59" width="110" height="14"/>
    <rect x="89" y="140" width="14" height="110"/>
    <rect x="517" y="250" width="14" height="74"/>
  </g>

  <!-- windows -->
  <g stroke="#0C2A5B" stroke-width="1" fill="none">
    <path d="M140 60H240M140 66H240M140 72H240M140 60V72M240 60V72"/>
    <path d="M360 60H470M360 66H470M360 72H470M360 60V72M470 60V72"/>
    <path d="M90 140V250M96 140V250M102 140V250M90 140H102M90 250H102"/>
    <path d="M518 250V324M524 250V324M530 250V324M518 250H530M518 324H530"/>
  </g>

  <!-- doors -->
  <g stroke="#0C2A5B" fill="none">
    <path d="M150 348V308" stroke-width="2"/>
    <path d="M150 308A40 40 0 0 1 190 348" stroke-width="0.8" stroke-dasharray="3 2"/>
    <path d="M308 140H342" stroke-width="2"/>
    <path d="M342 140A34 34 0 0 1 308 174" stroke-width="0.8" stroke-dasharray="3 2"/>
    <path d="M308 250H338" stroke-width="2"/>
    <path d="M338 250A30 30 0 0 1 308 280" stroke-width="0.8" stroke-dasharray="3 2"/>
    <path d="M452 214V248" stroke-width="2"/>
    <path d="M452 248A34 34 0 0 0 486 214" stroke-width="0.8" stroke-dasharray="3 2"/>
  </g>

  <!-- furniture & fittings -->
  <g stroke="#5D6F8A" stroke-width="1" fill="#fff">
    <path d="M102 72H250V96H126V180H102Z"/>
    <rect x="160" y="76" width="34" height="16" rx="3"/>
    <circle cx="214" cy="80" r="4"/><circle cx="228" cy="80" r="4"/><circle cx="214" cy="90" r="4"/><circle cx="228" cy="90" r="4"/>
    <rect x="150" y="200" width="92" height="56" rx="2"/>
    <circle cx="160" cy="194" r="6"/><circle cx="196" cy="194" r="6"/><circle cx="232" cy="194" r="6"/>
    <circle cx="160" cy="262" r="6"/><circle cx="196" cy="262" r="6"/><circle cx="232" cy="262" r="6"/>
    <rect x="200" y="296" width="92" height="40" rx="6"/>
    <rect x="470" y="82" width="42" height="64"/>
    <rect x="420" y="96" width="40" height="30" rx="2"/>
    <rect x="316" y="300" width="88" height="42" rx="10"/>
    <ellipse cx="392" cy="232" rx="10" ry="13"/>
    <rect x="320" y="222" width="34" height="22" rx="8"/>
    <rect x="432" y="256" width="78" height="86" rx="2"/>
    <rect x="440" y="262" width="28" height="14" rx="3"/><rect x="474" y="262" width="28" height="14" rx="3"/>
  </g>

  <!-- room labels -->
  <g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#0C2A5B" text-anchor="middle">
    <text x="200" y="148" font-size="11" font-weight="600">LIVING / KITCHEN</text>
    <text x="200" y="162" font-size="10" fill="#5D6F8A">28.4 m²</text>
    <text x="388" y="160" font-size="11" font-weight="600">STUDY</text>
    <text x="388" y="174" font-size="10" fill="#5D6F8A">9.6 m²</text>
    <text x="359" y="276" font-size="11" font-weight="600">BATH</text>
    <text x="359" y="290" font-size="10" fill="#5D6F8A">4.8 m²</text>
    <text x="468" y="236" font-size="11" font-weight="600">BED</text>
  </g>

  <!-- dimensions -->
  <g stroke="#5D6F8A" stroke-width="0.8" fill="none">
    <path d="M90 36H530M90 30V46M304 30V46M530 30V46"/>
    <path d="M86 40L94 32M300 40L308 32M526 40L534 32"/>
    <path d="M56 60V360M50 60H66M50 210H66M50 360H66"/>
    <path d="M52 64L60 56M52 214L60 206M52 364L60 356"/>
  </g>
  <g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="10" fill="#5D6F8A" text-anchor="middle">
    <text x="197" y="28">4 650</text>
    <text x="417" y="28">4 950</text>
    <text x="0" y="0" transform="translate(46 135) rotate(-90)">3 300</text>
    <text x="0" y="0" transform="translate(46 285) rotate(-90)">3 300</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(584 92)">
    <circle r="18" fill="none" stroke="#5D6F8A"/>
    <path d="M0 -15L7 10L0 5L-7 10Z" fill="#1D5FE0"/>
    <text y="-23" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0C2A5B">N</text>
  </g>

  <!-- title block -->
  <g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
    <rect x="396" y="398" width="224" height="42" fill="#fff" stroke="#D5DFEC"/>
    <line x1="396" y1="416" x2="620" y2="416" stroke="#D5DFEC"/>
    <text x="406" y="411" font-size="10" font-weight="600" fill="#0C2A5B">BEAVER &amp; WEAVER · ARCHITECTURAL</text>
    <text x="406" y="432" font-size="9.5" fill="#5D6F8A">A-101  GA PLAN L01  1:50</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t d">
  <title id="t">Coordinated MEP services section through a ceiling void</title>
  <desc id="d">Section showing a concrete slab and steel beam with a ventilation duct rerouted below the beam, heating pipework, a sprinkler main and cable tray hung from the slab above a suspended ceiling.</desc>
  <defs>
    <pattern id="conc" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#9FB0C7"/><circle cx="10" cy="9" r="1.4" fill="#9FB0C7"/><path d="M6 12l2-3 2 3z" fill="#B9C6D8"/>
    </pattern>
  </defs>
  <rect width="640" height="460" fill="#FFFFFF"/>
  <rect x="10" y="10" width="620" height="440" fill="none" stroke="#D5DFEC"/>

  <!-- slab -->
  <rect x="30" y="40" width="580" height="44" fill="url(#conc)" stroke="#0C2A5B" stroke-width="1.4"/>
  <!-- beam in section -->
  <g fill="#0C2A5B">
    <rect x="290" y="84" width="72" height="11"/>
    <rect x="322" y="95" width="8" height="124"/>
    <rect x="290" y="219" width="72" height="11"/>
  </g>
  <!-- hangers -->
  <g stroke="#5D6F8A" stroke-width="1.2">
    <path d="M86 84V138M158 84V138M196 84V250M440 84V250M470 84V122M590 84V122"/>
  </g>

  <!-- original (clashing) duct route -->
  <rect x="212" y="132" width="226" height="74" fill="none" stroke="#C2410C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <path d="M312 160l28 28m0 -28l-28 28" stroke="#C2410C" stroke-width="2"/>

  <!-- coordinated duct -->
  <rect x="196" y="250" width="244" height="64" fill="#1D5FE0" fill-opacity="0.9"/>
  <rect x="190" y="244" width="256" height="76" fill="none" stroke="#1D5FE0" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M196 250L440 314M440 250L196 314" stroke="#fff" stroke-width="0.8" stroke-opacity="0.7"/>
  <path d="M188 250H448" stroke="#0C2A5B" stroke-width="2"/>

  <!-- pipework -->
  <g stroke="#0C2A5B" stroke-width="1.2">
    <circle cx="86" cy="152" r="14" fill="#12A7D6"/>
    <circle cx="86" cy="152" r="20" fill="none" stroke-dasharray="2 2"/>
    <circle cx="158" cy="152" r="11" fill="#12A7D6" fill-opacity="0.6"/>
    <circle cx="158" cy="152" r="17" fill="none" stroke-dasharray="2 2"/>
    <path d="M66 138H178" stroke-width="2"/>
  </g>
  <circle cx="530" cy="250" r="9" fill="#C2410C" stroke="#0C2A5B"/>
  <path d="M530 259V350" stroke="#C2410C" stroke-width="2"/>
  <path d="M524 350h12l-6 8z" fill="#C2410C"/>

  <!-- cable tray -->
  <g stroke="#0C2A5B" stroke-width="1.4" fill="none">
    <path d="M466 110V124H594V110"/>
    <path d="M462 124H598" stroke-width="2"/>
  </g>
  <g fill="#2B66C9"><circle cx="480" cy="118" r="4"/><circle cx="490" cy="118" r="4"/><circle cx="500" cy="118" r="4"/><circle cx="512" cy="119" r="5"/><circle cx="524" cy="119" r="5"/><circle cx="540" cy="117" r="6"/></g>

  <!-- ceiling -->
  <path d="M30 362H610" stroke="#0C2A5B" stroke-width="2"/>
  <path d="M30 368H610" stroke="#9FB0C7" stroke-width="1" stroke-dasharray="40 6"/>

  <!-- void dimension -->
  <g stroke="#5D6F8A" stroke-width="0.8" fill="none">
    <path d="M60 84V362M54 84H66M54 362H66"/>
  </g>

  <!-- labels -->
  <g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="10" fill="#0C2A5B">
    <text x="0" y="0" transform="translate(50 250) rotate(-90)" fill="#5D6F8A">VOID 1 100</text>
    <text x="236" y="288" fill="#fff" font-weight="600">SA DUCT 900×250</text>
    <text x="236" y="302" fill="#fff">ins. 25 mm</text>
    <text x="70" y="196">LTHW F/R</text>
    <text x="70" y="208" fill="#5D6F8A">54 / 42</text>
    <text x="474" y="146">CABLE TRAY 150</text>
    <text x="546" y="248" fill="#C2410C">SPR. MAIN 65</text>
    <text x="370" y="106" font-weight="600">UB 533×210</text>
  </g>
  <g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="10">
    <rect x="34" y="384" width="350" height="54" fill="#fff" stroke="#C2410C"/>
    <text x="44" y="401" font-weight="600" fill="#C2410C">CLASH 0412 · DUCT vs BEAM, RESOLVED</text>
    <text x="44" y="416" fill="#0C2A5B">Duct dropped below UB, re-sized 900×250</text>
    <text x="44" y="430" fill="#5D6F8A">Agreed with M&amp;E designer · Rev C03</text>
  </g>

  <!-- title block -->
  <g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
    <rect x="396" y="398" width="224" height="42" fill="#fff" stroke="#D5DFEC"/>
    <line x1="396" y1="416" x2="620" y2="416" stroke="#D5DFEC"/>
    <text x="406" y="411" font-size="10" font-weight="600" fill="#0C2A5B">BEAVER &amp; WEAVER · MEP COORD.</text>
    <text x="406" y="432" font-size="9.5" fill="#5D6F8A">M-310  SECTION B–B  1:20</text>
  </g>
</svg>
